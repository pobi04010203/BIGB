<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소프트 엘리베이션 시안 비교</title>
<!-- 시안 비교 시트. 데이터(27MB) 없이 크롬 요소만 좌우로 놓는다.
     왼쪽은 현재 화면, 오른쪽은 soft.css 를 씌운 것이다. -->
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;background:var(--color-paper);color:var(--color-ink);
       font:var(--text-base)/var(--lh-body) var(--font-body)}
  .card .v,td.num{font-family:var(--font-outlier);font-variant-numeric:tabular-nums}
  header{border-bottom:var(--rule-hair) solid var(--color-ink);
         padding:var(--space-md)}
  h1{margin:0;font-size:var(--text-xl);font-weight:650;letter-spacing:var(--track-tight)}
  header .sub{color:var(--color-muted);font-size:var(--text-sm);margin-top:var(--space-3xs)}

  .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-lg);
         max-width:1500px;margin:0 auto;padding:var(--space-lg) var(--space-md)}
  .col > h2.tag{margin:0 0 var(--space-sm);font-size:var(--text-sm);
      letter-spacing:var(--track-wide);color:var(--color-muted);font-weight:600}
  .col.b > h2.tag{color:var(--color-ink)}

  /* ── 원본 크롬 (index.html 과 같은 규칙) ───────────────────────── */
  .cards{display:grid;gap:0;margin:0 0 var(--space-lg);
         grid-template-columns:repeat(2,minmax(0,1fr));
         border-top:var(--rule-hair) solid var(--color-ink)}
  .card{padding:var(--space-sm) var(--space-md) var(--space-md) 0;
        border-right:var(--rule-hair) solid var(--color-rule);min-width:0}
  .card:nth-child(2n){border-right:0;padding-left:var(--space-md);padding-right:0}
  .card .k{color:var(--color-muted);font-size:var(--text-xs);
           letter-spacing:var(--track-wide);margin-bottom:var(--space-2xs)}
  .card .v{font-size:var(--text-xl);font-weight:600;letter-spacing:var(--track-tight);
           line-height:1.05;color:var(--color-ink-2)}
  .card .n{color:var(--color-muted);font-size:var(--text-2xs);margin-top:var(--space-3xs)}
  .card.hi .v,.card.lead .v{font-size:var(--text-2xl);color:var(--color-ink)}
  .card.hi{border-right-color:var(--color-ink)}
  .card.lead .k{color:var(--color-ink)}

  section{background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule);
          border-radius:var(--radius-panel);margin-bottom:var(--space-md)}
  section.map{padding:var(--space-md) var(--space-md) var(--space-sm)}
  section.list{padding:var(--space-sm) var(--space-md) var(--space-md)}
  h2{margin:0 0 var(--space-3xs);font-size:var(--text-md);font-weight:600}
  .hint{color:var(--color-muted);font-size:var(--text-xs);margin:0 0 var(--space-sm)}

  .toolbar{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;
           margin-bottom:var(--space-xs)}
  label{font-size:var(--text-xs);color:var(--color-ink-2);display:flex;
        gap:var(--space-3xs);align-items:center;cursor:pointer}
  input[type=radio],input[type=checkbox]{accent-color:var(--color-chrome);margin:0}
  :focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
  .modes{display:inline-flex;border:var(--rule-hair) solid var(--color-muted);
         border-radius:var(--radius-control);overflow:hidden}
  .mode{border:0;background:var(--color-paper-2);padding:var(--space-3xs) var(--space-xs);
        font:inherit;font-size:var(--text-xs);color:var(--color-muted);cursor:pointer;
        border-right:var(--rule-hair) solid var(--color-rule);
        transition:background var(--dur-short) var(--ease-out)}
  .mode:last-child{border-right:0}
  .mode:hover{background:var(--color-paper-3);color:var(--color-ink)}
  .mode.on{background:var(--color-chrome);color:var(--color-paper-2)}

  .fakecanvas{display:block;width:100%;height:120px;background:var(--color-paper);
    border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-chip);
    display:flex;align-items:center;justify-content:center;
    color:var(--color-muted);font-size:var(--text-2xs)}
  .legend{display:flex;gap:var(--space-2xs);align-items:center;font-size:var(--text-2xs);
          color:var(--color-muted);margin-top:var(--space-xs);flex-wrap:wrap}
  .ramp{display:inline-flex;height:12px;border:var(--rule-hair) solid var(--color-rule);
        border-radius:2px;overflow:hidden}
  .ramp i{display:block;width:22px}
  .legend .chip{display:inline-block;width:11px;height:11px;border-radius:2px;
                vertical-align:-1px;margin-right:3px}
  .legend .fail{background:var(--scale-0);outline:1.5px solid var(--color-ink);
                outline-offset:-1.5px}
  .legend .mid{background:var(--scale-75);opacity:.30}
  .legend .clear{background:transparent;border:1px solid var(--color-rule)}

  table{width:100%;border-collapse:collapse;font-size:var(--text-xs)}
  th,td{text-align:left;padding:var(--space-3xs) var(--space-2xs);
        border-bottom:var(--rule-hair) solid var(--color-rule-2)}
  th{color:var(--color-muted);font-weight:600;background:var(--color-paper-3);
     letter-spacing:var(--track-wide);font-size:var(--text-2xs)}
  td.num{text-align:right}
  .scroll{max-height:150px;overflow:auto;
          border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-chip)}
  .pill{display:inline-block;padding:1px var(--space-2xs);border-radius:var(--radius-chip);
        font-size:var(--text-2xs);background:var(--color-paper-3);color:var(--color-muted)}
  .pill.w5{background:var(--color-w5-bg);color:var(--color-w5)}

  /* ── 오른쪽 열에만 soft.css 규칙을 스코프해 적용한다 ─────────────── */
  .col.b{
    --soft-dark: oklch(21.2% 0.009 256 / 0.10);
    --soft-dark-2: oklch(21.2% 0.009 256 / 0.06);
    --soft-light: oklch(100% 0 0 / 0.85);
    --soft-raise: 6px 6px 14px -6px var(--soft-dark), -5px -5px 12px -6px var(--soft-light);
    --soft-raise-sm: 3px 3px 8px -4px var(--soft-dark-2), -3px -3px 7px -4px var(--soft-light);
    --soft-inset: inset 3px 3px 7px -4px var(--soft-dark-2),
                  inset -2px -2px 6px -4px var(--soft-light);
  }
  .col.b section{box-shadow:var(--soft-raise)}
  .col.b .cards{gap:var(--space-2xs);border-top:0}
  .col.b .card{border-right:0;border-radius:var(--radius-panel);
    padding:var(--space-sm) var(--space-md);background:var(--color-paper-2);
    border:var(--rule-hair) solid var(--color-rule)}
  .col.b .card.hi,.col.b .card.lead{box-shadow:var(--soft-raise);
    border-color:var(--color-ink-2)}
  .col.b .card:not(.hi):not(.lead){background:transparent;border-color:var(--color-rule-2)}
  .col.b .modes{box-shadow:var(--soft-raise-sm)}
  .col.b .mode.on{box-shadow:var(--soft-inset)}
  .col.b .scroll{box-shadow:var(--soft-inset)}
  .col.b .pill{box-shadow:var(--soft-raise-sm)}
  .col.b .pill.w5{box-shadow:none}
  /* 데이터 표면은 양쪽 모두 손대지 않는다 */
  .col.b .fakecanvas,.col.b .ramp,.col.b .legend .chip{box-shadow:none}

  footer{color:var(--color-muted);font-size:var(--text-2xs);
    max-width:1500px;margin:0 auto;padding:0 var(--space-md) var(--space-2xl);
    border-top:var(--rule-hair) solid var(--color-rule);padding-top:var(--space-sm);
    line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>소프트 엘리베이션 시안 — 좌우 비교</h1>
  <div class="sub">왼쪽 현재 화면 · 오른쪽 A안. 데이터 영역(히트맵·램프·스와치)은 양쪽 모두 손대지 않았다.</div>
</header>

<div class="split" id="split"></div>

<footer>
  A안은 뉴모피즘의 "부드럽게 솟은 느낌"만 가져오고 대비는 그대로 둔다 —
  경계선을 지운 곳이 없고, 그림자는 잉크 색의 알파라 새 색상을 만들지 않는다.
  활성 탭이 안으로 눌린 것으로 보이는 것이 뉴모피즘에서 유일하게 기능적으로
  값어치 있는 부분이다.
</footer>

<script>
const RAMP = ['--scale-0','--scale-25','--scale-mid','--scale-75','--scale-1'];
function block(){
  return `
  <div class="cards">
    <div class="card"><div class="k">① 기하 커버리지 배치</div>
      <div class="v">60.2%</div><div class="n">IEC 62676-4 DORI observation 준수</div></div>
    <div class="card"><div class="k">② 문헌의 가정 곡선 배치</div>
      <div class="v">61.6%</div><div class="n">해석적 가정 · 측정값 아님</div></div>
    <div class="card hi"><div class="k">③ 실측 곡선 배치 — 제안</div>
      <div class="v">67.7%</div><div class="n">제안 방식</div></div>
    <div class="card lead"><div class="k">미달구역 — 줄어든 양</div>
      <div class="v">7944 → 3017</div><div class="n">P_total &lt; 0.5</div></div>
  </div>

  <section class="map">
    <h2>현장 검출확률 — 2D / 2.5D / 3D</h2>
    <p class="hint">잉크를 못 보는 곳에 몰아준다. 검출확률이 높은 구역은 칠하지 않고 윤곽만 남긴다.</p>
    <div class="toolbar">
      <label><input type="radio" name="v0" checked> 실측 곡선 배치 (제안)</label>
      <span class="modes">
        <button type="button" class="mode">2D 평면</button>
        <button type="button" class="mode on">2.5D 적층</button>
        <button type="button" class="mode">3D 회전</button>
      </span>
      <label><input type="checkbox" checked> 골조</label>
      <span class="pill">같은 8대 · 같은 자로 측정</span>
    </div>
    <div class="fakecanvas">히트맵 (데이터 영역 — 시안 대상 아님)</div>
    <div class="legend">
      <span>미달</span><span class="ramp">${RAMP.map(t=>`<i style="background:var(${t})"></i>`).join('')}</span><span>통과</span>
      <span style="margin-left:8px"><span class="chip fail"></span>P &lt; 0.5</span>
      <span><span class="chip mid"></span>0.5 ~ 0.9</span>
      <span><span class="chip clear"></span>0.9 이상</span>
    </div>
  </section>

  <section class="list">
    <h2>미달구역 — 3,017개 <span class="pill">실측 배치</span></h2>
    <p class="hint">위험가중치가 높은 순.</p>
    <div class="scroll"><table>
      <thead><tr><th>복셀</th><th>위치 (m)</th><th>위험구역</th>
        <th class="num">가중치</th><th class="num">P_total</th><th>원인</th></tr></thead>
      <tbody>
        <tr><td>v_0488</td><td class="num">25, 21</td><td>opening_perimeter</td>
            <td class="num"><span class="pill w5">5</span></td><td class="num">0.338</td><td>가림</td></tr>
        <tr><td>v_0867</td><td class="num">75, 39</td><td>opening_perimeter</td>
            <td class="num"><span class="pill w5">5</span></td><td class="num">0.338</td><td>가림</td></tr>
        <tr><td>v_6080</td><td class="num">25, 21</td><td>gangform_workface</td>
            <td class="num"><span class="pill w5">5</span></td><td class="num">0.363</td><td>가림</td></tr>
      </tbody>
    </table></div>
  </section>`;
}
document.getElementById('split').innerHTML =
  `<div class="col a"><h2 class="tag">현재 (커밋 상태)</h2>${block()}</div>` +
  `<div class="col b"><h2 class="tag">A안 — 소프트 엘리베이션</h2>${block()}</div>`;
</script>
</body>
</html>
